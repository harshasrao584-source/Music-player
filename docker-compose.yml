version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: melodyai_mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - melodyai_network
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: melodyai_backend
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/melodyai
      - JWT_SECRET=melodyai_super_secret_session_key_987654321
      - UPLOAD_PATH=uploads
    depends_on:
      - mongodb
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - melodyai_network
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: melodyai_frontend
    ports:
      - '5173:80'
    depends_on:
      - backend
    networks:
      - melodyai_network
    restart: always

volumes:
  mongodb_data:
  backend_uploads:

networks:
  melodyai_network:
    driver: bridge
